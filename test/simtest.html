<!doctype html><html><head><meta charset="utf-8"><style>.hidden{display:none}</style></head><body>
<div id="ov" class="hidden"><div id="ov-msg"></div><div id="ov-arrow"></div><button id="ov-main"></button><button id="ov-ref"></button><button id="ov-close"></button><canvas id="ov-ring" width="200" height="200"></canvas><div id="ov-pct"></div><canvas id="ov-mini" width="200" height="200"></canvas><div id="ov-stats" class="hidden"></div></div>
<div id="busy" class="hidden"><div id="busy-msg"></div></div>
<div id="sim-stage" class="hidden"></div>
<script type="text/plain" id="engine-src"></script>
<script src="../src/gl.js"></script><script src="../src/sim.js"></script><script src="../src/capture.js"></script>
<script>
window.runTest = async function(opts) {
  const src = await (await fetch('../src/engine.js')).text();
  document.getElementById('engine-src').textContent = src;
  const canvas = document.createElement('canvas'); canvas.width = 64; canvas.height = 64;
  const sim = new SimSource(opts); sim.init(canvas);
  const cap = new Capture({ onResult(){}, onError(m){ console.log('ERR', m); }, onExit(){} });
  cap.begin(sim, {}, {cfg: opts.cfg || {}});
  const t0 = performance.now();
  const r = await SimRunner.test(cap, sim, (s) => console.log(s));
  if (r.error) return { error: r.error };
  return { truth: +sim.truthVolume.toFixed(2), volume: +r.volume.toFixed(2), errPct: +((r.volume - sim.truthVolume)/sim.truthVolume*100).toFixed(2),
    plusMinusPct: +(1.5*r.sigma/r.volume*100).toFixed(1), coverage: +r.coverage.toFixed(3), maxH: +r.maxHeight.toFixed(2), flip: r.flipMode, flipLocked: r.flipLocked,
    flipStats: r.flipStats, nPoints: r.nPoints, nDepth: r.nDepthFrames, warnings: r.warnings, loopMis: r.loopMismatch, groundRms: r.ground.rms, camH: +r.camHeight.toFixed(2),
    progress: +r.progress.toFixed(3), parts: r.parts, secs: +((performance.now()-t0)/1000).toFixed(1) };
};
</script></body></html>
